<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Draw CSS grid layouts visually by clicking and dragging. Get grid-template-areas and related CSS instantly."
    />
    <title>Grid Cartographer — Visual CSS Grid Playground</title>

    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <div class="app-wrapper">
      <!-- ─── Header ─────────────────────────────────────────── -->
      <header class="site-header" role="banner">
        <span class="site-header__brand">
          <svg
            class="site-header__icon"
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            width="28"
            height="28"
          >
            <rect width="7" height="7" x="3" y="3" rx="1" />
            <rect width="7" height="7" x="14" y="3" rx="1" />
            <rect width="7" height="7" x="14" y="14" rx="1" />
            <rect width="7" height="7" x="3" y="14" rx="1" />
          </svg>
          <span class="site-header__title">Grid Cartographer</span>
        </span>
        <p class="site-header__tagline">Draw layouts. Get CSS.</p>
        <div class="site-header__actions">
          <a
            href="https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout/Grid_template_areas"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn--ghost"
            aria-label="CSS grid-template-areas docs (opens in new tab)"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              width="15"
              height="15"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M12 16v-4M12 8h.01" />
            </svg>
            Docs
          </a>
        </div>
      </header>

      <!-- ─── Main ───────────────────────────────────────────── -->
      <main class="app-main" id="main-content">
        <!-- ─── Left panel: editor ──────────────────────────── -->
        <section class="panel panel--left" aria-label="Grid editor">
          <!-- Dimension controls -->
          <div class="panel-section">
            <h2 class="panel__title">Grid dimensions</h2>
            <div class="controls" role="group" aria-label="Grid dimension controls">
              <!-- Columns -->
              <div class="control-group">
                <label class="control-group__label" for="input-columns">Columns</label>
                <div
                  class="number-input"
                  role="spinbutton"
                  aria-label="Columns"
                  aria-valuenow="4"
                  aria-valuemin="1"
                  aria-valuemax="12"
                >
                  <button
                    class="number-input__btn"
                    id="btn-cols-dec"
                    type="button"
                    aria-label="Decrease columns"
                    tabindex="-1"
                  >
                    <svg
                      aria-hidden="true"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M5 12h14" />
                    </svg>
                  </button>
                  <input
                    class="number-input__field"
                    id="input-columns"
                    type="number"
                    min="1"
                    max="12"
                    value="4"
                    aria-label="Number of columns"
                  />
                  <button
                    class="number-input__btn"
                    id="btn-cols-inc"
                    type="button"
                    aria-label="Increase columns"
                    tabindex="-1"
                  >
                    <svg
                      aria-hidden="true"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M5 12h14M12 5v14" />
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Rows -->
              <div class="control-group">
                <label class="control-group__label" for="input-rows">Rows</label>
                <div
                  class="number-input"
                  role="spinbutton"
                  aria-label="Rows"
                  aria-valuenow="4"
                  aria-valuemin="1"
                  aria-valuemax="12"
                >
                  <button
                    class="number-input__btn"
                    id="btn-rows-dec"
                    type="button"
                    aria-label="Decrease rows"
                    tabindex="-1"
                  >
                    <svg
                      aria-hidden="true"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M5 12h14" />
                    </svg>
                  </button>
                  <input
                    class="number-input__field"
                    id="input-rows"
                    type="number"
                    min="1"
                    max="12"
                    value="4"
                    aria-label="Number of rows"
                  />
                  <button
                    class="number-input__btn"
                    id="btn-rows-inc"
                    type="button"
                    aria-label="Increase rows"
                    tabindex="-1"
                  >
                    <svg
                      aria-hidden="true"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M5 12h14M12 5v14" />
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Reset button -->
              <div class="control-group">
                <span class="control-group__label" aria-hidden="true">&nbsp;</span>
                <button
                  class="btn btn--ghost"
                  id="btn-reset"
                  type="button"
                  aria-label="Reset grid to defaults"
                >
                  <svg
                    aria-hidden="true"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                  </svg>
                  Reset
                </button>
              </div>
            </div>
          </div>

          <!-- Interactive grid -->
          <div class="panel-section">
            <h2 class="panel__title" id="grid-label">Layout canvas</h2>
            <div class="grid-container">
              <div
                class="grid-workspace"
                id="grid-workspace"
                role="grid"
                aria-labelledby="grid-label"
                aria-multiselectable="true"
              >
                <!-- Cells rendered by JS -->
              </div>
            </div>
            <p class="grid-empty-hint" id="grid-hint" aria-live="polite">
              Click and drag to define a named grid area
            </p>
          </div>
        </section>

        <!-- ─── Right panel: areas + output ────────────────── -->
        <section class="panel panel--right" aria-label="CSS output">
          <!-- Named areas list -->
          <div class="panel-section">
            <h2 class="panel__title">Named areas</h2>
            <div class="areas-list" aria-label="Defined grid areas">
              <ul
                class="areas-list__items"
                id="areas-list"
                role="list"
                aria-label="Grid areas"
                aria-live="polite"
              >
                <!-- Area items rendered by JS -->
              </ul>
              <!-- Empty state (shown by JS when no areas) -->
              <div class="areas-empty" id="areas-empty" role="status" aria-label="No areas defined">
                <svg
                  aria-hidden="true"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  width="32"
                  height="32"
                >
                  <rect width="7" height="7" x="3" y="3" rx="1" />
                  <rect width="7" height="7" x="14" y="3" rx="1" />
                  <rect width="7" height="7" x="14" y="14" rx="1" />
                  <rect width="7" height="7" x="3" y="14" rx="1" />
                </svg>
                <span>No areas yet</span>
                <span class="areas-empty__hint">
                  Drag across grid cells to define your first area
                </span>
              </div>
            </div>
          </div>

          <!-- CSS output -->
          <div class="panel-section">
            <div class="output-panel">
              <div class="output-panel__header">
                <h2 class="panel__title">Generated CSS</h2>
                <button
                  class="btn btn--action"
                  id="btn-copy"
                  type="button"
                  aria-label="Copy CSS to clipboard"
                  disabled
                >
                  <svg
                    aria-hidden="true"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    width="15"
                    height="15"
                  >
                    <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                  </svg>
                  <span class="btn-copy-label">Copy CSS</span>
                </button>
              </div>

              <!-- Warnings from CSS validation -->
              <div
                class="output-warnings"
                id="output-warnings"
                role="alert"
                aria-live="assertive"
                aria-label="CSS validation warnings"
              >
                <!-- Warnings injected by JS -->
              </div>

              <pre
                class="output-panel__pre"
                role="region"
                aria-label="Generated CSS code"
                aria-live="polite"
                aria-atomic="true"
              ><code class="output-panel__code" id="output-code"><!-- Empty state placeholder --><span class="output-empty" aria-hidden="true">
  <span class="output-placeholder-line"></span>
  <span class="output-placeholder-line"></span>
  <span class="output-placeholder-line"></span>
</span></code></pre>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- ─── Name input overlay (global, positioned by JS) ─── -->
    <div
      class="name-overlay"
      id="name-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="name-overlay-title"
      hidden
    >
      <p id="name-overlay-title" class="panel__title">Name this area</p>
      <input
        class="name-overlay__input"
        id="name-overlay-input"
        type="text"
        placeholder="e.g. header"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-describedby="name-overlay-error"
      />
      <p class="name-overlay__error" id="name-overlay-error" role="alert" aria-live="polite"></p>
      <div class="name-overlay__actions">
        <button class="btn btn--ghost" id="name-overlay-cancel" type="button">Cancel</button>
        <button class="btn btn--action" id="name-overlay-confirm" type="button">Add area</button>
      </div>
    </div>

    <!-- ─── Context menu ────────────────────────────────────── -->
    <div class="context-menu" id="context-menu" role="menu" aria-label="Area options" hidden>
      <button
        class="context-menu__item context-menu__item--danger"
        id="context-menu-delete"
        type="button"
        role="menuitem"
      >
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"
          />
        </svg>
        <span id="context-menu-label">Remove area</span>
      </button>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
